<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <title>九九チャレンジ</title>
  <style>
    :root { color-scheme: light dark; --ink: #1c1b20; --paper: #f9f9ff; --card: #ffffff; --line: #d7d7e5; --key: #efeff8; --main: #4f46e5; --good: #138a4a; --bad: #c52828; }
    @media (prefers-color-scheme: dark) { :root { --ink: #eeeeff; --paper: #17171e; --card: #24242e; --line: #474755; --key: #31313d; --main: #a9a3ff; --good: #72dc9c; --bad: #ffb4ab; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
    main { width: min(100%, 460px); min-height: 100dvh; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); display: grid; align-content: center; gap: 16px; }
    .topline { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .score { color: color-mix(in srgb, var(--ink) 65%, transparent); font-variant-numeric: tabular-nums; }
    .progress { height: 8px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--ink) 12%, transparent); }
    .progress span { display: block; height: 100%; width: 0%; background: var(--main); transition: width .2s ease; }
    .problem { text-align: center; padding: 32px 12px 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
    .equation { font-size: clamp(52px, 19vw, 78px); font-weight: 600; letter-spacing: .03em; }
    .answer { min-height: 48px; margin-top: 12px; color: color-mix(in srgb, var(--ink) 50%, transparent); font-size: 34px; font-variant-numeric: tabular-nums; }
    .answer.has-value { color: var(--ink); }
    .feedback { min-height: 24px; margin-top: 8px; font-weight: 600; }
    .ok { color: var(--good); }.ng { color: var(--bad); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    button { min-height: 64px; border: 1px solid var(--line); border-radius: 16px; background: var(--key); color: var(--ink); font: inherit; font-size: 24px; font-weight: 600; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:active { transform: scale(.97); }
    .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
    .submit { background: var(--main); color: white; border-color: var(--main); }
    .reset { font-size: 16px; }
  </style>
</head>
<body>
  <main aria-label="九九チャレンジ">
    <div class="topline"><strong>九九チャレンジ</strong><span class="score" id="score">0 問中 0 問正解</span></div>
    <div class="progress" aria-label="10問中の進捗"><span id="bar"></span></div>
    <section class="problem" aria-live="polite">
      <div class="equation" id="question">3 × 4</div>
      <div class="answer" id="answer" aria-label="入力した答え">？</div>
      <div class="feedback" id="feedback"></div>
    </section>
    <div class="keypad" aria-label="答えをタッチで入力">
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
      <button type="button" data-key="clear" aria-label="入力を消す">消す</button><button type="button" data-key="0">0</button><button type="button" data-key="back" aria-label="一文字消す">⌫</button>
    </div>
    <div class="actions"><button type="button" class="submit" id="check">こたえる</button><button type="button" class="reset" id="reset">はじめから</button></div>
  </main>
  <script>
    const question = document.querySelector('#question'), answer = document.querySelector('#answer'), feedback = document.querySelector('#feedback'), score = document.querySelector('#score'), bar = document.querySelector('#bar');
    let left, right, entry = '', total = 0, correct = 0, locked = false;
    function renderEntry() { answer.textContent = entry || '？'; answer.classList.toggle('has-value', Boolean(entry)); }
    function renderScore() { score.textContent = `${total} 問中 ${correct} 問正解`; bar.style.width = `${Math.min(total, 10) * 10}%`; }
    function next() { left = Math.floor(Math.random() * 9) + 1; right = Math.floor(Math.random() * 9) + 1; entry = ''; locked = false; question.textContent = `${left} × ${right}`; feedback.textContent = ''; feedback.className = 'feedback'; renderEntry(); }
    function check() { if (locked || !entry) return; locked = true; total++; if (Number(entry) === left * right) { correct++; feedback.textContent = '正解！'; feedback.className = 'feedback ok'; } else { feedback.textContent = `答えは ${left * right}`; feedback.className = 'feedback ng'; } renderScore(); setTimeout(next, 850); }
    document.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => { if (locked) return; const key = button.dataset.key; if (key === 'clear') entry = ''; else if (key === 'back') entry = entry.slice(0, -1); else if (entry.length < 2) entry += key; renderEntry(); }));
    document.querySelector('#check').addEventListener('click', check);
    document.querySelector('#reset').addEventListener('click', () => { total = 0; correct = 0; renderScore(); next(); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    renderScore(); next();
  </script>
</body>
</html>
