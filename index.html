<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <title>九九ゲームDX</title>
  <style>
    :root { color-scheme: light; --ink: #28304a; --paper: #f4f6ff; --card: #fff; --line: #d8ddf3; --key: #f0f2ff; --main: #6366f1; --good: #159b56; --bad: #e45c61; }
    * { box-sizing: border-box; }
    body { position: relative; isolation: isolate; margin: 0; min-height: 100dvh; overflow-x: hidden; background: radial-gradient(circle at 12% 8%, #fff7c7 0 7%, transparent 22%), radial-gradient(circle at 92% 18%, #ffd9eb 0 8%, transparent 24%), linear-gradient(150deg, #dff8ff 0%, #eef2ff 48%, #fff3f8 100%); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
    body::before, body::after { content: ''; position: fixed; z-index: -1; border-radius: 50%; pointer-events: none; filter: blur(2px); opacity: .62; }
    body::before { width: 180px; height: 180px; top: 30%; left: -70px; background: #bdeff2; }
    body::after { width: 220px; height: 220px; right: -90px; bottom: 7%; background: #f8c9df; }
    main { position: relative; z-index: 1; width: min(100%, 460px); min-height: 100dvh; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); display: grid; align-content: center; gap: 16px; }
    .topline { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .title { font-size: 20px; }
    .penta-card { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid #d8ddf3; border-radius: 18px; background: #fff; }
    .penta { position: relative; width: 70px; height: 70px; flex: 0 0 70px; border-radius: 48% 48% 45% 45%; background: #4b6b9d; }
    .penta::before { content: ''; position: absolute; inset: 16px 11px 9px; border-radius: 50%; background: #fff; }
    .penta-eye { position: absolute; z-index: 1; top: 24px; width: 7px; height: 9px; border-radius: 50%; background: #29344f; }
    .penta-eye.left { left: 24px; }.penta-eye.right { right: 24px; }
    .penta-beak { position: absolute; z-index: 2; top: 35px; left: 29px; width: 13px; height: 8px; border-radius: 50% 50% 60% 60%; background: #ffc64d; }
    .penta-ribbon { position: absolute; z-index: 3; top: -5px; right: 9px; width: 22px; height: 12px; border-radius: 70% 35% 70% 35%; background: #f58cab; transform: rotate(20deg); }
    .penta-scarf { position: absolute; z-index: 3; right: 6px; bottom: 8px; left: 6px; height: 9px; border-radius: 99px; background: #68d6e5; }
    .penta[data-outfit="star"] .penta-ribbon { background: #ffd55c; box-shadow: 0 0 0 3px #fff2a8; clip-path: polygon(50% 0, 61% 35%, 100% 35%, 69% 56%, 81% 100%, 50% 73%, 19% 100%, 31% 56%, 0 35%, 39% 35%); border-radius: 0; }
    .penta[data-outfit="star"] .penta-scarf { background: #a98cf7; }
    .penta[data-outfit="flower"] .penta-ribbon { width: 19px; height: 19px; border-radius: 50%; background: #ff91b8; box-shadow: -8px 0 #ffb3cc, 8px 0 #ffb3cc, 0 -8px #ffb3cc, 0 8px #ffb3cc; }
    .penta[data-outfit="flower"] .penta-scarf { background: #83d987; }
    .penta[data-outfit="rainbow"] .penta-ribbon { background: #9c87f6; }
    .penta[data-outfit="rainbow"] .penta-scarf { background: linear-gradient(90deg, #f27e8d, #ffc64d, #7edb92, #70b8f2, #b18bf5); }
    .penta-message { color: #596684; font-size: 14px; font-weight: 700; line-height: 1.45; }
    .penta.happy { animation: penta-jump .45s ease 2; }.penta.sad { animation: penta-shake .5s ease; }
    @keyframes penta-jump { 50% { transform: translateY(-10px) rotate(-5deg); } }
    @keyframes penta-shake { 25% { transform: translateX(-5px) rotate(-4deg); } 75% { transform: translateX(5px) rotate(4deg); } }
    .confetti-layer { position: fixed; inset: 0; z-index: 20; overflow: hidden; pointer-events: none; }
    .confetti { position: absolute; top: -14px; width: 10px; height: 16px; border-radius: 3px; opacity: 0; animation: confetti-fall 900ms ease-out forwards; }
    @keyframes confetti-fall { 0% { opacity: 1; transform: translate3d(0, -10px, 0) rotate(0deg); } 100% { opacity: 0; transform: translate3d(var(--drift), 105vh, 0) rotate(540deg); } }
    .score { color: #65708e; font-size: 14px; font-variant-numeric: tabular-nums; }
    .points { color: var(--main); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .lives { color: #e45c61; font-size: 18px; font-weight: 800; letter-spacing: .08em; }
    .game-stats { display: flex; justify-content: space-between; align-items: center; }
    .combo { color: #ef7a31; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .highscore { color: #9b6d21; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .voice-status { min-height: 20px; text-align: center; color: #69769a; font-size: 13px; font-weight: 700; }
    .voice-status.listening { color: var(--main); }
    .coin-bank { display: flex; justify-content: center; align-items: center; gap: 6px; color: #a46e08; font-size: 18px; font-weight: 800; }
    .coin-bank span { color: #c78500; font-variant-numeric: tabular-nums; }
    .gacha { padding: 14px; border: 1px solid #eadbb2; border-radius: 18px; background: #fffdf6; text-align: center; }
    .gacha h2 { margin: 0 0 6px; color: #9b6d21; font-size: 17px; }.gacha p { margin: 0 0 10px; color: #786b51; font-size: 13px; }
    .gacha-button { min-height: 48px; padding: 0 18px; border-color: #e5b240; border-radius: 14px; background: linear-gradient(#ffd968, #f5b944); color: #704600; font-size: 16px; }
    .gacha-message { min-height: 20px; margin: 9px 0 3px; color: #786b51; font-size: 13px; font-weight: 700; }
    .wardrobe { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-top: 9px; }.wardrobe button { min-height: 36px; padding: 0 9px; border-radius: 11px; font-size: 12px; }.wardrobe button.is-worn { border-color: #8b7df0; background: #e9e6ff; color: #5446bd; }
    .level-status { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; color: #6a5cc6; font-size: 13px; font-weight: 800; }
    .xp-bar { height: 8px; overflow: hidden; border-radius: 99px; background: #e3e0fa; }
    .xp-bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #9f7aea, #6366f1); transition: width .25s ease; }
    .mode { padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
    .mode-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; font-weight: 700; }
    .mode-title span { color: #687391; font-size: 12px; font-weight: 500; }
    .mode-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .mode-button { min-height: 40px; border-radius: 12px; font-size: 15px; }
    .mode-button.all { grid-column: span 2; }
    .mode-button.weak { grid-column: span 2; background: #fff4df; border-color: #f0ca7a; color: #985d00; }
    .mode-button.weak.is-selected { background: #f2a62c; border-color: #f2a62c; color: #fff; }
    .mode-button.is-selected { background: var(--main); border-color: var(--main); color: #fff; }
    .progress { height: 8px; border-radius: 99px; overflow: hidden; background: #dfe3f6; }
    .progress span { display: block; height: 100%; width: 0%; background: var(--main); transition: width .2s ease; }
    .problem { width: min(62%, 300px); justify-self: center; text-align: center; padding: 6px 4px 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: 0 8px 20px rgb(77 88 156 / 8%); }
    .stage-label { margin-bottom: 8px; color: #707b9d; font-size: 14px; font-weight: 700; }
    .equation { font-size: clamp(52px, 19vw, 78px); font-weight: 800; letter-spacing: .03em; }
    .answer { min-height: 48px; margin-top: 12px; color: #a0a8bf; font-size: 34px; font-variant-numeric: tabular-nums; }
    .answer.has-value { color: var(--ink); }
    .feedback { min-height: 24px; margin-top: 8px; font-weight: 700; }
    .ok { color: var(--good); } .ng { color: var(--bad); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .keypad { display: none; }
    button { min-height: 64px; border: 1px solid var(--line); border-radius: 16px; background: var(--key); color: var(--ink); font: inherit; font-size: 24px; font-weight: 700; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
    button:active { transform: scale(.97); }
    .actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .submit { display: none; }
    .submit { background: var(--main); color: #fff; border-color: var(--main); }
    .reset { font-size: 16px; }
    @media (max-height: 820px) {
      main { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); gap: 6px; align-content: start; }
      .penta-card { padding: 5px 9px; gap: 8px; }
      .penta { width: 48px; height: 48px; flex-basis: 48px; }
      .penta::before { inset: 11px 8px 6px; }
      .penta-eye { top: 17px; width: 5px; height: 7px; }
      .penta-eye.left { left: 17px; }.penta-eye.right { right: 17px; }
      .penta-beak { top: 24px; left: 20px; width: 9px; height: 6px; }
      .penta-ribbon { top: -3px; right: 6px; width: 16px; height: 9px; }
      .penta-scarf { right: 4px; bottom: 5px; left: 4px; height: 6px; }
      .penta-message { font-size: 12px; }
      .mode { padding: 7px; }
      .mode-title { margin-bottom: 5px; font-size: 13px; }
      .mode-buttons { gap: 4px; }
      .mode-button { min-height: 29px; font-size: 12px; border-radius: 8px; }
      .progress { height: 5px; }
      .problem { width: min(62%, 260px); padding: 1px 2px; border-radius: 10px; }
      .stage-label { margin-bottom: 2px; font-size: 12px; }
      .equation { font-size: clamp(42px, 13vw, 58px); }
      .answer { min-height: 30px; margin-top: 2px; font-size: 24px; }
      .feedback { min-height: 18px; margin-top: 2px; font-size: 13px; }
      .voice-status { min-height: 16px; font-size: 11px; }
      .actions { gap: 5px; }
      .reset { min-height: 36px; font-size: 13px; }
      .gacha { padding: 7px; }
      .gacha h2 { margin-bottom: 2px; font-size: 14px; }
      .gacha p { margin-bottom: 4px; font-size: 11px; }
      .gacha-button { min-height: 32px; font-size: 13px; }
      .gacha-message { min-height: 14px; margin: 3px 0 1px; font-size: 11px; }
      .wardrobe { gap: 4px; margin-top: 3px; }
      .wardrobe button { min-height: 25px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
  <main aria-label="九九ゲームDX">
    <div class="topline"><strong class="title">九九ゲームDX</strong><span class="lives" id="lives" aria-label="ライフ 3">♥ ♥ ♥</span><span class="points" id="points">0点</span></div>
    <div class="penta-card" aria-live="polite">
      <div class="penta" id="penta" aria-label="ぺんた"><span class="penta-eye left"></span><span class="penta-eye right"></span><span class="penta-beak"></span><span class="penta-ribbon"></span><span class="penta-scarf"></span></div>
      <div class="penta-message" id="penta-message">こんにちは！ わたしはぺんた！</div>
    </div>
    <div class="game-stats"><span class="score" id="score">0問中 0問正解</span><span class="combo" id="combo">0コンボ</span><span class="highscore">最高 <span id="high-score">0</span>点</span></div>
    <div class="level-status"><span id="level">Lv.1</span><div class="xp-bar" aria-label="経験値"><span id="xp-bar"></span></div><span id="xp">0 / 100 EXP</span></div>

    <section class="mode" aria-labelledby="mode-title">
      <div class="mode-title" id="mode-title">どの段であそぶ？ <span id="selected-mode">全部の段</span></div>
      <div class="mode-buttons" id="mode-buttons">
        <button class="mode-button is-selected all" type="button" data-table="all">全部</button>
        <button class="mode-button" type="button" data-table="1">1の段</button>
        <button class="mode-button" type="button" data-table="2">2の段</button>
        <button class="mode-button" type="button" data-table="3">3の段</button>
        <button class="mode-button" type="button" data-table="4">4の段</button>
        <button class="mode-button" type="button" data-table="5">5の段</button>
        <button class="mode-button" type="button" data-table="6">6の段</button>
        <button class="mode-button" type="button" data-table="7">7の段</button>
        <button class="mode-button" type="button" data-table="8">8の段</button>
        <button class="mode-button" type="button" data-table="9">9の段</button>
        <button class="mode-button weak" type="button" data-table="weak">苦手だけ</button>
      </div>
    </section>

    <div class="progress" aria-label="10問中の進み具合"><span id="bar"></span></div>
    <section class="problem" aria-live="polite">
      <div class="stage-label" id="stage-label">全部の段</div>
      <div class="equation" id="question">3 × 4</div>
      <div class="answer" id="answer" aria-label="入力した答え">−</div>
      <div class="feedback" id="feedback"></div>
    </section>
    <div class="voice-status" id="voice-status" aria-live="polite">音声認識を準備中…</div>
    <div class="keypad" aria-label="答えをタップで入力">
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
      <button type="button" data-key="clear" aria-label="入力を消す">消す</button><button type="button" data-key="0">0</button><button type="button" data-key="back" aria-label="一文字消す">戻る</button>
    </div>
    <div class="actions"><button type="button" class="submit" id="check">こたえる</button><button type="button" class="reset" id="reset">はじめから</button></div>
    <div class="coin-bank" aria-label="コイン"><span aria-hidden="true">🪙</span> コイン <span id="coins">0</span></div>
    <section class="gacha" aria-labelledby="gacha-title">
      <h2 id="gacha-title">ぺんたのきせかえガチャ</h2>
      <p>コイン10枚で新しいアイテムを1つゲット！</p>
      <button type="button" class="gacha-button" id="gacha-button">ガチャをひく（🪙 10）</button>
      <div class="gacha-message" id="gacha-message">集めたアイテムをタップして着せ替えよう！</div>
      <div class="wardrobe" id="wardrobe" aria-label="持っている着せ替えアイテム"></div>
    </section>
  </main>
  <script>
    const question = document.querySelector('#question');
    const answer = document.querySelector('#answer');
    const feedback = document.querySelector('#feedback');
    const score = document.querySelector('#score');
    const points = document.querySelector('#points');
    const lives = document.querySelector('#lives');
    const comboLabel = document.querySelector('#combo');
    const highScoreLabel = document.querySelector('#high-score');
    const voiceStatus = document.querySelector('#voice-status');
    const coinsLabel = document.querySelector('#coins');
    const levelLabel = document.querySelector('#level');
    const xpLabel = document.querySelector('#xp');
    const xpBar = document.querySelector('#xp-bar');
    const penta = document.querySelector('#penta');
    const pentaMessage = document.querySelector('#penta-message');
    const gachaButton = document.querySelector('#gacha-button');
    const gachaMessage = document.querySelector('#gacha-message');
    const wardrobe = document.querySelector('#wardrobe');
    const confettiLayer = document.querySelector('#confetti-layer');
    let audioContext = null;
    const HIGH_SCORE_KEY = 'kuku-dx-high-score';
    const COINS_KEY = 'kuku-dx-coins';
    const LEVEL_KEY = 'kuku-dx-level';
    const XP_KEY = 'kuku-dx-experience';
    const OUTFITS_KEY = 'kuku-dx-outfits';
    const WORN_OUTFIT_KEY = 'kuku-dx-worn-outfit';
    const WEAK_QUESTIONS_KEY = 'kuku-dx-weak-questions';
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const bar = document.querySelector('#bar');
    const selectedMode = document.querySelector('#selected-mode');
    const stageLabel = document.querySelector('#stage-label');
    let left, right, entry = '', total = 0, correct = 0, point = 0, combo = 0, life = 3, locked = false, gameOver = false, selectedTable = 'all';
    let highScore = Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
    let coins = Number(localStorage.getItem(COINS_KEY)) || 0;
    let level = Number(localStorage.getItem(LEVEL_KEY)) || 1;
    let experience = Number(localStorage.getItem(XP_KEY)) || 0;
    const outfits = [
      { id: 'default', name: 'いつもの服', rarity: 'ノーマル' },
      { id: 'star', name: 'ほしのリボン', rarity: 'レア' },
      { id: 'flower', name: 'おはなリボン', rarity: 'レア' },
      { id: 'rainbow', name: 'にじのマフラー', rarity: 'スーパーレア' }
    ];
    let ownedOutfits;
    try { ownedOutfits = JSON.parse(localStorage.getItem(OUTFITS_KEY)) || ['default']; } catch { ownedOutfits = ['default']; }
    if (!ownedOutfits.includes('default')) ownedOutfits.unshift('default');
    let wornOutfit = localStorage.getItem(WORN_OUTFIT_KEY) || 'default';
    if (!ownedOutfits.includes(wornOutfit)) wornOutfit = 'default';
    let weakQuestions;
    try { weakQuestions = JSON.parse(localStorage.getItem(WEAK_QUESTIONS_KEY)) || {}; } catch { weakQuestions = {}; }
    let recognition = null, isListening = false, restartTimer = null;

    function tableName() {
      if (selectedTable === 'all') return '全部の段';
      if (selectedTable === 'weak') return '苦手だけ';
      return `${selectedTable}の段`;
    }
    function saveWeakQuestions() { localStorage.setItem(WEAK_QUESTIONS_KEY, JSON.stringify(weakQuestions)); }
    function weakQuestionKey() { return `${left}x${right}`; }
    function rememberWeakQuestion() {
      const key = weakQuestionKey();
      weakQuestions[key] = (weakQuestions[key] || 0) + 1;
      saveWeakQuestions();
    }
    function improveWeakQuestion() {
      const key = weakQuestionKey();
      if (!weakQuestions[key]) return;
      weakQuestions[key]--;
      if (weakQuestions[key] <= 0) delete weakQuestions[key];
      saveWeakQuestions();
    }
    function renderEntry() { answer.textContent = entry || '−'; answer.classList.toggle('has-value', Boolean(entry)); }
    function renderScore() {
      score.textContent = `${total}問中 ${correct}問正解`;
      points.textContent = `${point}点`;
      comboLabel.textContent = `${combo}コンボ`;
      highScoreLabel.textContent = highScore;
      coinsLabel.textContent = coins;
      const neededExperience = level * 100;
      levelLabel.textContent = `Lv.${level}`;
      xpLabel.textContent = `${experience} / ${neededExperience} EXP`;
      xpBar.style.width = `${Math.min(experience / neededExperience * 100, 100)}%`;
      renderWardrobe();
      lives.textContent = '♥ '.repeat(life).trim() || '♥ 0';
      lives.setAttribute('aria-label', `ライフ ${life}`);
      bar.style.width = `${Math.min(total, 10) * 10}%`;
    }
    function setVoiceStatus(message, listening = false) { voiceStatus.textContent = message; voiceStatus.classList.toggle('listening', listening); }
    function cheerPenta(message, animation = '') {
      pentaMessage.textContent = message;
      penta.classList.remove('happy', 'sad');
      if (animation) {
        void penta.offsetWidth;
        penta.classList.add(animation);
      }
    }
    function celebrateCorrect() {
      const colors = ['#f58cab', '#ffd55c', '#68d6e5', '#9f7aea', '#83d987'];
      const pieces = Array.from({ length: 28 }, (_, index) => {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.style.left = `${8 + Math.random() * 84}%`;
        piece.style.background = colors[index % colors.length];
        piece.style.setProperty('--drift', `${-90 + Math.random() * 180}px`);
        piece.style.animationDelay = `${Math.random() * 120}ms`;
        return piece;
      });
      confettiLayer.replaceChildren(...pieces);
      setTimeout(() => confettiLayer.replaceChildren(), 1100);
    }
    function playTone(frequency, duration, type = 'sine', volume = 0.08, delay = 0) {
      try {
        audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        const start = audioContext.currentTime + delay;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      } catch { /* 音声に対応していない環境でもゲームは続行 */ }
    }
    function playCorrectSound() {
      playTone(659, 0.13, 'sine', 0.07);
      playTone(988, 0.2, 'sine', 0.07, 0.1);
    }
    function playWrongSound() {
      playTone(220, 0.22, 'triangle', 0.08);
    }
    function renderWardrobe() {
      penta.dataset.outfit = wornOutfit;
      wardrobe.replaceChildren(...outfits.filter(outfit => ownedOutfits.includes(outfit.id)).map(outfit => {
        const button = document.createElement('button');
        button.type = 'button'; button.textContent = outfit.name;
        button.classList.toggle('is-worn', outfit.id === wornOutfit);
        button.addEventListener('click', () => {
          wornOutfit = outfit.id; localStorage.setItem(WORN_OUTFIT_KEY, wornOutfit);
          gachaMessage.textContent = `${outfit.name}に着せ替えたよ！`;
          renderWardrobe();
        });
        return button;
      }));
    }
    function drawGacha() {
      const pool = outfits.filter(outfit => !ownedOutfits.includes(outfit.id));
      if (!pool.length) { gachaMessage.textContent = '全部集まったね！ ぺんたも大よろこび！'; return; }
      if (coins < 10) { gachaMessage.textContent = `コインがあと${10 - coins}枚でガチャをひけるよ。`; return; }
      coins -= 10;
      const item = pool[Math.floor(Math.random() * pool.length)];
      ownedOutfits.push(item.id); wornOutfit = item.id;
      localStorage.setItem(COINS_KEY, coins);
      localStorage.setItem(OUTFITS_KEY, JSON.stringify(ownedOutfits));
      localStorage.setItem(WORN_OUTFIT_KEY, wornOutfit);
      gachaMessage.textContent = `やった！ ${item.name}（${item.rarity}）をゲット！`;
      cheerPenta('わあ！ すてきなお洋服！', 'happy');
      renderScore();
    }
    function spokenNumberToValue(transcript) {
      const normalized = transcript.toLowerCase().replace(/[\s、。,.]/g, '').replace(/^(こたえは|答えは)/, '').replace(/[０-９]/g, char => String.fromCharCode(char.charCodeAt(0) - 0xfee0));
      const digits = normalized.match(/\d{1,2}/);
      if (digits) return Number(digits[0]);
      const kanji = { '〇': 0, '零': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
      if (/^[〇零一二三四五六七八九十]+$/.test(normalized)) {
        const [before, after] = normalized.split('十');
        if (normalized.includes('十')) return (before ? kanji[before] : 1) * 10 + (after ? kanji[after] : 0);
        return kanji[normalized];
      }
      const units = { 'ぜろ': 0, 'れい': 0, 'いち': 1, 'に': 2, 'さん': 3, 'よん': 4, 'し': 4, 'ご': 5, 'ろく': 6, 'なな': 7, 'しち': 7, 'はち': 8, 'きゅう': 9, 'く': 9 };
      if (Object.hasOwn(units, normalized)) return units[normalized];
      const tens = [['きゅうじゅう', 90], ['はちじゅう', 80], ['ななじゅう', 70], ['しちじゅう', 70], ['ろくじゅう', 60], ['ごじゅう', 50], ['よんじゅう', 40], ['しじゅう', 40], ['さんじゅう', 30], ['にじゅう', 20], ['じゅう', 10]];
      for (const [word, value] of tens) {
        if (normalized.startsWith(word)) {
          const remainder = normalized.slice(word.length);
          if (!remainder) return value;
          if (Object.hasOwn(units, remainder)) return value + units[remainder];
        }
      }
      return null;
    }
    function scheduleListening() {
      clearTimeout(restartTimer);
      restartTimer = setTimeout(startListening, 500);
    }
    function setupRecognition() {
      if (!SpeechRecognition) { setVoiceStatus('このブラウザでは音声認識を使えません。テンキーで答えよう。'); return; }
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP'; recognition.interimResults = true; recognition.continuous = false; recognition.maxAlternatives = 1;
      recognition.onresult = event => {
        isListening = false;
        const value = spokenNumberToValue(event.results[0][0].transcript);
        if (value === null || value > 81) { cheerPenta('\u805e\u304d\u53d6\u308c\u306a\u3044\uff5e\u3082\u3046\u4e00\u56de\u8a00\u3063\u3066\uff5e', 'sad'); setVoiceStatus('数字を聞き取れなかったよ。もういちど話してね。'); scheduleListening(); return; }
        entry = String(value); renderEntry(); setVoiceStatus(`「${value}」と聞こえたよ！`); check();
      };
      recognition.onerror = event => {
        isListening = false;
        if (event.error !== 'not-allowed' && event.error !== 'service-not-allowed') cheerPenta('\u805e\u304d\u53d6\u308c\u306a\u3044\uff5e\u3082\u3046\u4e00\u56de\u8a00\u3063\u3066\uff5e', 'sad');
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') setVoiceStatus('マイクを許可すると、声で答えられるよ。');
        else if (!locked && !gameOver) { setVoiceStatus('もういちど答えを話してね。'); scheduleListening(); }
      };
      recognition.onspeechend = () => {
        if (isListening) recognition.stop();
      };
      recognition.onend = () => { isListening = false; if (!locked && !gameOver && voiceStatus.classList.contains('listening')) scheduleListening(); };
    }
    function startListening() {
      if (!SpeechRecognition || locked || gameOver || isListening) return;
      if (!recognition) setupRecognition();
      if (!recognition) return;
      try { recognition.start(); isListening = true; setVoiceStatus('🎤 こたえを話してね', true); } catch { /* recognition is already starting */ }
    }
    function stopListening() {
      clearTimeout(restartTimer);
      if (recognition && isListening) recognition.stop();
      isListening = false;
    }
    function next() {
      const weakEntries = Object.entries(weakQuestions);
      if (selectedTable === 'weak' && weakEntries.length) {
        const weighted = weakEntries.flatMap(([key, count]) => Array(Math.min(count, 4)).fill(key));
        [left, right] = weighted[Math.floor(Math.random() * weighted.length)].split('x').map(Number);
      } else {
        left = selectedTable === 'all' || selectedTable === 'weak' ? Math.floor(Math.random() * 9) + 1 : Number(selectedTable);
        right = Math.floor(Math.random() * 9) + 1;
      }
      entry = ''; locked = false;
      question.textContent = `${left} × ${right}`;
      stageLabel.textContent = selectedTable === 'weak' && !weakEntries.length ? '苦手だけ（まだないので全部の段）' : tableName();
      feedback.textContent = ''; feedback.className = 'feedback';
      renderEntry();
      startListening();
    }
    function resetGame() { stopListening(); total = 0; correct = 0; point = 0; combo = 0; life = 3; gameOver = false; cheerPenta('もういちど、いっしょにがんばろう！'); renderScore(); next(); }
    function addExperience(amount) {
      experience += amount;
      let leveledUp = false;
      while (experience >= level * 100) { experience -= level * 100; level++; leveledUp = true; }
      localStorage.setItem(LEVEL_KEY, level);
      localStorage.setItem(XP_KEY, experience);
      return leveledUp;
    }
    function check() {
      if (locked || gameOver || !entry) return;
      locked = true; total++;
      stopListening();
      if (Number(entry) === left * right) {
        correct++; point += 10; combo++; coins++; improveWeakQuestion(); localStorage.setItem(COINS_KEY, coins);
        const leveledUp = addExperience(10);
        if (point > highScore) { highScore = point; localStorage.setItem(HIGH_SCORE_KEY, highScore); }
        const reward = `+10点・+1コイン・+10EXP${leveledUp ? '　レベルアップ！' : ''}`;
        feedback.textContent = combo > 1 ? `せいかい！ ${reward}　${combo}コンボ！` : `せいかい！ ${reward}`;
        cheerPenta(leveledUp ? 'レベルアップ！ すごいよ！' : 'やったー！ せいかい！', 'happy');
        celebrateCorrect();
        playCorrectSound();
        feedback.className = 'feedback ok';
      }
      else {
        life--; combo = 0; rememberWeakQuestion();
        if (life === 0) { gameOver = true; feedback.textContent = `ゲームオーバー！ こたえは ${left * right}。はじめからで再挑戦！`; cheerPenta('またいっしょに挑戦しよう！', 'sad'); }
        else { feedback.textContent = `おしい！ こたえは ${left * right}（ライフ -1）`; cheerPenta('おしい〜！ もういっかい！', 'sad'); }
        feedback.className = 'feedback ng';
        playWrongSound();
      }
      renderScore();
      if (!gameOver) setTimeout(next, 850);
    }
    document.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => {
      if (locked) return;
      const key = button.dataset.key;
      if (key === 'clear') entry = '';
      else if (key === 'back') entry = entry.slice(0, -1);
      else if (entry.length < 2) entry += key;
      renderEntry();
    }));
    document.querySelectorAll('[data-table]').forEach(button => button.addEventListener('click', () => {
      selectedTable = button.dataset.table;
      document.querySelectorAll('[data-table]').forEach(item => item.classList.toggle('is-selected', item === button));
      selectedMode.textContent = tableName();
      resetGame();
    }));
    document.querySelector('#check').addEventListener('click', check);
    document.querySelector('#reset').addEventListener('click', resetGame);
    gachaButton.addEventListener('click', drawGacha);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    renderScore(); next();
  </script>
</body>
</html>
